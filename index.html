<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma Oficial del Evento</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f3f8;
            color: #333;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        /* Contenedor Principal Adaptable */
        .cronograma-container {
            width: 100%;
            max-width: 900px;
            background-color: #e5def1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        /* Encabezado Fijo */
        .header {
            background-color: #c7b8e6;
            padding: 30px 20px 0 20px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header h1 {
            font-size: 28px;
            color: #1a0dab;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            font-weight: 800;
        }

        /* Selector de Días (Ocupa el ancho disponible) */
        .day-selector {
            display: flex;
            background-color: #b19fd9;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            overflow: hidden;
        }

        .day-tab {
            flex: 1;
            padding: 16px 10px;
            text-align: center;
            font-size: 14px;
            text-transform: uppercase;
            font-weight: bold;
            color: #554375;
            cursor: pointer;
            transition: background 0.3s, color 0.3s;
        }

        .day-tab span {
            display: block;
            font-size: 12px;
            font-weight: normal;
            opacity: 0.8;
            margin-top: 4px;
        }

        .day-tab.active {
            background-color: #1d3557;
            color: #ffffff;
        }

        /* Lista de Actividades */
        .timeline {
            flex: 1;
            padding: 10px 0;
        }

        .event-card {
            display: flex;
            border-bottom: 1px solid rgba(0,0,0,0.06);
            background-color: rgba(255, 255, 255, 0.25);
            transition: background-color 0.3s;
        }

        /* Estado: En Curso (Fondo azul oscuro, letras blancas) */
        .event-card.current {
            background-color: #1d3557;
            color: #ffffff;
        }

        /* Estado: Actividad ya finalizada */
        .event-card.past {
            opacity: 0.55;
        }

        /* Columna de Horarios */
        .time-col {
            width: 100px;
            padding: 22px 15px;
            font-size: 14px;
            color: #665588;
            font-weight: 600;
            text-align: right;
            white-space: nowrap;
        }

        .event-card.current .time-col {
            color: #a8dadc;
        }

        /* Columna de Información */
        .info-col {
            flex: 1;
            padding: 22px 20px 22px 10px;
        }

        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .event-title {
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            color: #3b2a5c;
            letter-spacing: 0.5px;
        }

        .event-card.current .event-title {
            color: #ffffff;
        }

        .event-desc {
            font-size: 13.5px;
            line-height: 1.5;
            color: #5d4f75;
        }

        .event-card.current .event-desc {
            color: #f1faee;
        }

        /* Etiquetas de Estado */
        .status-badge {
            font-size: 10px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
            margin-left: 12px;
        }

        .status-badge.current {
            background-color: #ffffff;
            color: #1d3557;
        }

        .status-badge.next {
            background-color: #ffffff;
            color: #554375;
            border: 1px solid #b19fd9;
        }

        /* Adaptación para pantallas móviles */
        @media (max-width: 600px) {
            .header h1 { font-size: 24px; }
            .day-tab { font-size: 12px; padding: 12px 5px; }
            .day-tab span { font-size: 10px; }
            .time-col { width: 85px; font-size: 12px; padding: 18px 10px; }
            .info-col { padding: 18px 15px 18px 5px; }
            .event-title { font-size: 14px; }
            .event-desc { font-size: 12.5px; }
        }
    </style>
</head>
<body>
