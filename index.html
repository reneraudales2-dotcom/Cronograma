<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conferencia Incondicional 2026 - Programa</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1b2a; /* Fondo azul profundo oscuro de la paleta */
            color: #e0e1dd;
            padding-bottom: 70px; /* Espacio para que la barra inferior fija no tape contenido */
            display: flex;
            justify-content: center;
        }

        .cronograma-container {
            width: 100%;
            max-width: 1000px;
            background-color: #1b263b; /* Variante azul marino de la paleta */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        /* --- CORRECCIÓN EN EL ENCABEZADO --- */
        .header {
            background-color: #0d1b2a;
            padding: 10px 20px 0 20px; /* Reducido al mínimo */
            position: relative; /* YA NO ES STICKY para que no flote tapando la pantalla */
            z-index: 10;
            border-bottom: 2px solid #e63946; /* Borde rosa/rojo encendido de la paleta */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- REDUCCIÓN DEL TAMAÑO DEL LOGO --- */
        .logo-container {
            width: 100%;
            max-width: 180px; /* Reducido de 320px a 180px para que sea super compacto */
            height: auto;
            margin: -20px 0 -10px 0; /* Márgenes negativos para absorber el espacio vacío transparente que trae la imagen */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .logo-img {
            width: 100%;
            height: auto;
            display: block;
            /* Filtro avanzado: convierte las letras oscuras en un tono claro/plateado 
               para que resalten perfectamente sobre el fondo azul marino */
            filter: invert(0.9) brightness(1.5);
        }

        /* Selector de Días */
        .day-selector {
            width: 100%;
            display: flex;
            background-color: #415a77;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            overflow: hidden;
            margin-top: 5px;
        }

        .day-tab {
            flex: 1;
            padding: 16px 10px;
            text-align: center;
            font-size: 14px;
            text-transform: uppercase;
            font-weight: bold;
            color: #e0e1dd;
            cursor: pointer;
            transition: background 0.3s, color 0.3s;
        }

        .day-tab span {
            display: block;
            font-size: 11px;
            font-weight: normal;
            opacity: 0.8;
            margin-top: 4px;
        }

        .day-tab.active {
            background-color: #e63946; /* Pestaña activa en color rosa/rojo encendido */
            color: #ffffff;
        }

        /* Encabezados de Columnas Obligatorios */
        .table-headers {
            display: flex;
            background-color: #0d1b2a;
            padding: 12px 0;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffb5a7; /* Rosa claro para los títulos de columnas */
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Columnas del Cronograma */
        .col-hora {
            width: 90px;
            text-align: center;
            flex-shrink: 0;
        }

        .col-duracion {
            width: 90px;
            text-align: center;
            flex-shrink: 0;
        }

        .col-actividad {
            flex: 1;
            padding-left: 15px;
            padding-right: 15px;
        }

        .timeline {
            flex: 1;
            padding: 5px 0;
        }

        /* Tarjetas de Actividades */
        .event-card {
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background-color: rgba(255, 255, 255, 0.02);
            padding: 20px 0;
            transition: background-color 0.3s;
        }

        /* Estado: En Curso */
        .event-card.current {
            background-color: #0d1b2a;
            box-shadow: inset 4px 0 0 #e63946;
        }

        /* Estado: Ya pasó */
        .event-card.past {
            opacity: 0.4;
        }

        .time-display {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
        }

        .duration-display {
            font-size: 13px;
            color: #ffb5a7;
            font-weight: 500;
        }

        .event-card.current .duration-display {
            color: #ffffff;
            font-weight: 700;
        }

        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
            gap: 10px;
        }

        .event-title {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .event-desc {
            font-size: 13.5px;
            line-height: 1.5;
            color: #cbd5e1;
            margin-bottom: 4px;
        }

        .event-moderadores {
            font-size: 12px;
            font-style: italic;
            color: #ffb5a7;
        }

        .event-card.current .event-moderadores {
            color: #ffffff;
        }

        /* Etiquetas de Estado */
        .status-badge {
            font-size: 10px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .status-badge.current {
            background-color: #e63946;
            color: #ffffff;
        }

        .status-badge.next {
            background-color: transparent;
            color: #ffb5a7;
            border: 1px solid #ffb5a7;
        }

        /* Barra Inferior Dinámica Estilo App */
        .bottom-status-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 1000px;
            background-color: #4a121a; /* Tonalidad vino oscuro de la paleta */
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 2px solid #e63946;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
            z-index: 20;
        }

        .status-label {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            color: #ffb5a7;
            letter-spacing: 1px;
        }

        .status-current-title {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            text-transform: uppercase;
            max-width: 70%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Ajustes Responsivos para Celulares */
        @media (max-width: 600px) {
            .logo-container { max-width: 130px; margin: -15px 0 -5px 0; }
            .day-tab { font-size: 12px; padding: 12px 5px; }
            .day-tab span { font-size: 10px; }
            .col-hora { width: 70px; }
            .col-duracion { width: 70px; }
            .time-display { font-size: 12px; }
            .duration-display { font-size: 11px; }
            .event-title { font-size: 14px; }
            .event-desc { font-size: 12.5px; }
            .event-moderadores { font-size: 11px; }
            .status-label { font-size: 9px; }
            .status-current-title { font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="cronograma-container">
        <!-- Encabezado Limpio sin Bloqueo de Scroll -->
        <div class="header">
            <div class="logo-container">
                <img src="Incon copia-1.png" alt="Conferencia Incondicional 2026" class="logo-img">
            </div>
            <div class="day-selector">
                <div class="day-tab active" data-date="2026-06-12" onclick="switchDay('2026-06-12')">Viernes<span>12 Junio</span></div>
                <div class="day-tab" data-date="2026-06-13" onclick="switchDay('2026-06-13')">Sábado<span>13 Junio</span></div>
            </div>
        </div>

        <!-- Títulos de las Columnas Sobre la Lista -->
        <div class="table-headers">
            <div class="col-hora">Hora</div>
            <div class="col-duracion">Duración</div>
            <div class="col-actividad">Actividad</div>
        </div>

        <!-- Contenedor del Cronograma -->
        <div id="timeline" class="timeline"></div>

        <!-- Barra Inferior de Estado en Tiempo Real -->
        <div class="bottom-status-bar">
            <span class="status-label">Evento en curso</span>
            <span id="live-status-title" class="status-current-title">Buscando actividad...</span>
        </div>
    </div>

    <script>
        // DATOS OFICIALES DE LA CONFERENCIA
        const events = [
            // --- VIERNES 12 DE JUNIO ---
            { date: '2026-06-12', start: '18:00', end: '18:30', duration: '30 min.', title: 'Inscripción', desc: 'Info', mod: 'Martín y Lourdes Hasbum' }, //
            { date: '2026-06-12', start: '18:30', end: '19:00', duration: '30 min.', title: 'Video intro + alabanza + coro + danza', desc: 'A.W. + Media', mod: '' }, //
            { date: '2026-06-12', start: '19:00', end: '19:45', duration: '45 min.', title: 'Pastor Juan Granados', desc: 'Video intro', mod: '' }, //
            { date: '2026-06-12', start: '19:45', end: '20:30', duration: '45 min.', title: 'Pastor Armando Medina', desc: 'Video intro', mod: '' }, //
            { date: '2026-06-12', start: '20:30', end: '20:40', duration: '10 min.', title: 'Ofrenda', desc: 'Media', mod: '' }, //
            { date: '2026-06-12', start: '20:40', end: '21:00', duration: '20 min.', title: 'Despedida y fotografías en mural', desc: '', mod: '' }, //

            // --- SÁBADO 13 DE JUNIO ---
            { date: '2026-06-13', start: '08:00', end: '08:30', duration: '30 min.', title: 'Inscripción', desc: 'Info', mod: 'Martín y Lourdes Hasbum' }, //
            { date: '2026-06-13', start: '08:30', end: '09:00', duration: '30 min.', title: 'Video intro + alabanza + coro + danza', desc: 'A.W. + Media', mod: '' }, //
            { date: '2026-06-13', start: '09:00', end: '09:30', duration: '45 min.', title: 'Pastor Alejandro Medina', desc: '', mod: '' }, //
            { date: '2026-06-13', start: '09:30', end: '10:00', duration: '30 min.', title: 'Break', desc: 'Cocina + Ágape Coffee (Pendiente: POS)', mod: '' }, //
            { date: '2026-06-13', start: '10:00', end: '11:00', duration: '1 hr.', title: 'Apóstol Edmundo Guillén', desc: '', mod: '' }, //
            { date: '2026-06-13', start: '11:00', end: '12:00', duration: '1 hr.', title: 'Apóstol Misael Argeñal', desc: '', mod: '' }, //
            { date: '2026-06-13', start: '12:00', end: '13:00', duration: '1 hora', title: 'Almuerzo', desc: 'Cocina + Ágape Coffee (Caja con preguntas anónimas)', mod: '' }, //
            { date: '2026-06-13', start: '13:00', end: '13:10', duration: '10 min', title: 'Alabanza', desc: '', mod: '' }, //
            { date: '2026-06-13', start: '13:10', end: '14:10', duration: '1 hr.', title: 'Apóstol Edmundo Guillén', desc: '', mod: '' }, //
            { date: '2026-06-13', start: '14:10', end: '14:55', duration: '45 min.', title: 'Foro de liderazgo', desc: 'Apóstol Edmundo Guillén + Apóstol Misael Argeñal + Pastor Armando', mod: '' }, //
            { date: '2026-06-13', start: '14:55', end: '15:05', duration: '10 min.', title: 'Danza + dramatización', desc: 'Grupo de danza - El hijo pródigo (instrumental) + video con versículo y conclusión.', mod: '' }, //
            { date: '2026-06-13', start: '15:05', end: '16:05', duration: '1 hr.', title: 'Apóstol Misael Argeñal', desc: '', mod: '' }, //
            { date: '2026-06-13', start: '16:05', end: '16:15', duration: '10 min.', title: 'Ofrenda', desc: '', mod: '' }, //
            { date: '2026-06-13', start: '16:15', end: '17:00', duration: '45 min.', title: 'Despedida + fotografías', desc: '', mod: '' } //
        ];

        let activeDay = '2026-06-12';

        function renderTimeline() {
            const container = document.getElementById('timeline');
            container.innerHTML = '';

            const now = new Date(); 
            const filteredEvents = events.filter(e => e.date === activeDay);
            
            let foundCurrent = false;
            let foundNext = false;
            let currentActiveEventTitle = "Ninguno en este momento";

            // Verificar si hay alguna actividad en curso globalmente
            events.forEach((event) => {
                const eventStart = new Date(`${event.date}T${event.start}:00`);
                const eventEnd = new Date(`${event.date}T${event.end}:00`);
                if (now >= eventStart && now < eventEnd) {
                    currentActiveEventTitle = event.title;
                }
            });
            
            document.getElementById('live-status-title').innerText = currentActiveEventTitle;

            // Renderizar las actividades divididas en las 3 columnas solicitadas
            filteredEvents.forEach((event) => {
                const card = document.createElement('div');
                card.className = 'event-card';

                const eventStart = new Date(`${event.date}T${event.start}:00`);
                const eventEnd = new Date(`${event.date}T${event.end}:00`);

                let statusHtml = '';
                
                if (now >= eventStart && now < eventEnd) {
                    card.classList.add('current');
                    statusHtml = '<span class="status-badge current">En curso</span>';
                    foundCurrent = true;
                } else if (now < eventStart) {
                    if (!foundCurrent && !foundNext) {
                        statusHtml = '<span class="status-badge next">Próximo</span>';
                        foundNext = true; 
                    }
                } else {
                    card.classList.add('past');
                }

                // Ajustar formato de hora visual (12 horas am/pm)
                const [hour, min] = event.start.split(':');
                const hInt = parseInt(hour);
                const ampm = hInt >= 12 ? 'pm' : 'am';
                const formattedHour = hInt % 12 === 0 ? 12 : hInt % 12;
                const timeString = `${formattedHour}:${min}${ampm}`;

                card.innerHTML = `
                    <div class="col-dash col-hora">
                        <span class="time-display">${timeString}</span>
                    </div>
                    <div class="col-dash col-duracion">
                        <span class="duration-display">${event.duration}</span>
                    </div>
                    <div class="col-actividad">
                        <div class="title-row">
                            <span class="event-title">${event.title}</span>
                            ${statusHtml}
                        </div>
                        ${event.desc ? `<p class="event-desc">${event.desc}</p>` : ''}
                        ${event.mod ? `<p class="event-moderadores">Moderadores: ${event.mod}</p>` : ''}
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        function switchDay(dateString) {
            activeDay = dateString;
            
            document.querySelectorAll('.day-tab').forEach(tab => {
                if (tab.getAttribute('data-date') === dateString) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });

            renderTimeline();
        }

        // Ejecución obligatoria al cargar
        renderTimeline();
        
        // Revisión de cambios de estado en segundo plano automáticamente cada 10 segundos
        setInterval(renderTimeline, 10000);
    </script>
</body>
</html>
