<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma Oficial del Evento</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f3f8;
            color: #333;
            padding-bottom: 60px; /* Espacio para que la barra inferior no tape el último evento */
            display: flex;
            justify-content: center;
        }

        .cronograma-container {
            width: 100%;
            max-width: 900px;
            background-color: #e5def1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            position: relative;
        }

        .header {
            background-color: #c7b8e6;
            padding: 30px 20px 0 20px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header h1 {
            font-size: 28px;
            color: #1a0dab;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            font-weight: 800;
        }

        .day-selector {
            display: flex;
            background-color: #b19fd9;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            overflow: hidden;
        }

        .day-tab {
            flex: 1;
            padding: 16px 10px;
            text-align: center;
            font-size: 14px;
            text-transform: uppercase;
            font-weight: bold;
            color: #554375;
            cursor: pointer;
            transition: background 0.3s, color 0.3s;
        }

        .day-tab span {
            display: block;
            font-size: 12px;
            font-weight: normal;
            opacity: 0.8;
            margin-top: 4px;
        }

        .day-tab.active {
            background-color: #1d3557;
            color: #ffffff;
        }

        .timeline {
            flex: 1;
            padding: 10px 0;
        }

        .event-card {
            display: flex;
            border-bottom: 1px solid rgba(0,0,0,0.06);
            background-color: rgba(255, 255, 255, 0.25);
            transition: background-color 0.3s;
        }

        .event-card.current {
            background-color: #1d3557;
            color: #ffffff;
        }

        .event-card.past {
            opacity: 0.55;
        }

        .time-col {
            width: 100px;
            padding: 22px 15px;
            font-size: 14px;
            color: #665588;
            font-weight: 600;
            text-align: right;
            white-space: nowrap;
        }

        .event-card.current .time-col {
            color: #a8dadc;
        }

        .info-col {
            flex: 1;
            padding: 22px 20px 22px 10px;
        }

        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .event-title {
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            color: #3b2a5c;
            letter-spacing: 0.5px;
        }

        .event-card.current .event-title {
            color: #ffffff;
        }

        .event-desc {
            font-size: 13.5px;
            line-height: 1.5;
            color: #5d4f75;
        }

        .event-card.current .event-desc {
            color: #f1faee;
        }

        .status-badge {
            font-size: 10px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
            margin-left: 12px;
        }

        .status-badge.current {
            background-color: #ffffff;
            color: #1d3557;
        }

        .status-badge.next {
            background-color: #ffffff;
            color: #554375;
            border: 1px solid #b19fd9;
        }

        /* --- NUEVA BARRA INFERIOR FIJA --- */
        .bottom-status-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 900px;
            background-color: #c7b8e6;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(0,0,0,0.1);
            box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
            z-index: 20;
        }

        .status-label {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            color: #1a0dab;
            letter-spacing: 1px;
        }

        .status-current-title {
            font-size: 13px;
            font-weight: 700;
            color: #3b2a5c;
            text-transform: uppercase;
            max-width: 70%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @media (max-width: 600px) {
            .header h1 { font-size: 24px; }
            .day-tab { font-size: 12px; padding: 12px 5px; }
            .day-tab span { font-size: 10px; }
            .time-col { width: 85px; font-size: 12px; padding: 18px 10px; }
            .info-col { padding: 18px 15px 18px 5px; }
            .event-title { font-size: 14px; }
            .event-desc { font-size: 12.5px; }
            .status-label { font-size: 10px; }
            .status-current-title { font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="cronograma-container">
        <div class="header">
            <h1>Programa</h1>
            <div class="day-selector">
                <div class="day-tab active" data-date="2026-06-12" onclick="switchDay('2026-06-12')">Viernes<span>12 Junio</span></div>
                <div class="day-tab" data-date="2026-06-13" onclick="switchDay('2026-06-13')">Sábado<span>13 Junio</span></div>
            </div>
        </div>

        <div id="timeline" class="timeline"></div>

        <div class="bottom-status-bar">
            <span class="status-label">Evento en curso</span>
            <span id="live-status-title" class="status-current-title">Cargando...</span>
        </div>
    </div>

    <script>
        const events = [
            // --- VIERNES 12 DE JUNIO ---
            { date: '2026-06-12', start: '08:00', end: '09:00', title: 'Registro y Acreditación', desc: 'Apertura de puertas y entrega de identificadores.' },
            { date: '2026-06-12', start: '09:00', end: '10:30', title: 'Conferencia de Apertura', desc: 'Bienvenida oficial del evento e introducción.' },
            { date: '2026-06-12', start: '10:30', end: '11:00', title: 'Coffee Break', desc: 'Espacio para networking en el área del patio.' },
            { date: '2026-06-12', start: '11:00', end: '13:00', title: 'Panel de Expertos', desc: 'Mesa redonda interactiva.' },

            // --- SÁBADO 13 DE JUNIO ---
            { date: '2026-06-13', start: '09:00', end: '11:00', title: 'Talleres Prácticos', desc: 'Sesiones simultáneas en las salas.' },
            { date: '2026-06-13', start: '11:00', end: '12:30', title: 'Presentación de Proyectos', desc: 'Exposición interactiva en el auditorio.' },
            { date: '2026-06-13', start: '12:30', end: '13:00', title: 'Clausura y Premiación', desc: 'Cierre del evento y certificaciones.' }
        ];

        let activeDay = '2026-06-12';

        function renderTimeline() {
            const container = document.getElementById('timeline');
            container.innerHTML = '';

            const now = new Date(); 
            const filteredEvents = events.filter(e => e.date === activeDay);
            
            let foundCurrent = false;
            let foundNext = false;
            let currentActiveEventTitle = "Ninguno en este momento";

            // Primero buscamos globalmente si hay ALGÚN evento en curso hoy para actualizar la barra inferior
            events.forEach((event) => {
                const eventStart = new Date(`${event.date}T${event.start}:00`);
                const eventEnd = new Date(`${event.date}T${event.end}:00`);
                if (now >= eventStart && now < eventEnd) {
                    currentActiveEventTitle = event.title;
                }
            });
            
            // Actualizamos el texto de la barra inferior fija
            document.getElementById('live-status-title').innerText = currentActiveEventTitle;

            // Renderizamos la lista de la pestaña seleccionada
            filteredEvents.forEach((event) => {
                const card = document.createElement('div');
                card.className = 'event-card';

                const eventStart = new Date(`${event.date}T${event.start}:00`);
                const eventEnd = new Date(`${event.date}T${event.end}:00`);

                let statusHtml = '';
                
                if (now >= eventStart && now < eventEnd) {
                    card.classList.add('current');
                    statusHtml = '<span class="status-badge current">En curso</span>';
                    foundCurrent = true;
                } else if (now < eventStart) {
                    if (!foundCurrent && !foundNext) {
                        statusHtml = '<span class="status-badge next">Próximo</span>';
                        foundNext = true; 
                    }
                } else {
                    card.classList.add('past');
                }

                const [hour, min] = event.start.split(':');
                const hInt = parseInt(hour);
                const ampm = hInt >= 12 ? 'pm' : 'am';
                const formattedHour = hInt % 12 === 0 ? 12 : hInt % 12;
                const timeString = `${formattedHour}:${min}${ampm}`;

                card.innerHTML = `
                    <div class="time-col">${timeString}</div>
                    <div class="info-col">
                        <div class="title-row">
                            <span class="event-title">${event.title}</span>
                            ${statusHtml}
                        </div>
                        <p class="event-desc">${event.desc}</p>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        function switchDay(dateString) {
            activeDay = dateString;
            
            document.querySelectorAll('.day-tab').forEach(tab => {
                if (tab.getAttribute('data-date') === dateString) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });

            renderTimeline();
        }

        // Ejecución inicial
        renderTimeline();
        
        // Comprobación automática de tiempos en segundo plano cada 10 segundos
        setInterval(renderTimeline, 10000);
    </script>
</body>
</html>
